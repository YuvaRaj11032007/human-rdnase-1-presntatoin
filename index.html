<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cystic Fibrosis & Recombinant DNase 1 | Interactive Presentation</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="presentation-app">
    <!-- Sleek Minimal Header -->
    <header class="presentation-header">
      <div class="header-left">
        <div class="logo-pill">
          <span class="pulse-dot"></span>
          <span class="logo-text">MED·BIO INTERACTIVE</span>
        </div>
        <div class="stage-title-pill">
          <span id="deck-stage-badge" class="stage-number">STAGE 01 / 10</span>
          <span id="deck-title" class="stage-name">Hi Nanna Case Study: Autosomal Recessive Inheritance & Chromosome 7</span>
        </div>
      </div>

      <div class="header-right">
        <button id="labels-toggle-btn" class="icon-text-btn" title="Toggle Anatomical Labels [L]">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
          <span>Labels</span>
        </button>

        <button id="notes-toggle-btn" class="icon-text-btn" title="Presenter Notes [N]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span>Notes</span>
        </button>

        <button id="sound-toggle-btn" class="icon-btn" title="Audio Sound FX [M]">
          <svg id="sound-on-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <svg id="sound-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>

        <button id="fullscreen-btn" class="icon-btn" title="Full Screen [F]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>
      </div>
    </header>

    <!-- Main Viewport: Centered Rectangle Stage -->
    <main class="stage-viewport">
      <div class="stage-frame">
        <canvas id="stage-canvas"></canvas>
      </div>
    </main>

    <!-- Presenter Notes Drawer (Collapsible) -->
    <div id="speaker-notes-drawer" class="notes-drawer">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <span class="drawer-icon">🎙️</span>
          <h3>Speaker Presentation Notes</h3>
        </div>
        <button id="close-notes-btn" class="icon-btn-small">✕</button>
      </div>
      <div class="drawer-body" id="speaker-notes-content">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- Minimal Sleek Presentation Footer Controls -->
    <footer class="presentation-footer">
      <div class="footer-nav">
        <button id="btn-prev" class="nav-control-btn icon-only" title="Previous Slide [← or PageUp]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <div class="slide-dots-container" id="slide-dots">
          <!-- Dots rendered dynamically -->
        </div>

        <button id="btn-next" class="nav-control-btn icon-only" title="Next Slide [→ or Space or PageDown]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="js/sound.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
